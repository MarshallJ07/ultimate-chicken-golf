name: itch.io upload

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Show workspace (debug)
        run: |
          pwd
          ls -R

      - name: Install Butler
        uses: jamiephan/itch-butler-action@v1

      - name: Verify build folder exists
        run: |
          if [ ! -d "./build" ]; then
            echo "ERROR: build folder not found"
            exit 1
          fi
          ls -R ./build

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          ./butler push ./build marshalljamieson/golf-game:windows
